name: Matrix Calculator CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ doxygen graphviz valgrind libgtest-dev

      - name: Build and install Google Test
        run: |
          cd /usr/src/googletest
          sudo cmake .
          sudo make
          sudo make install

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run tests with CTest
        run: cd build && ctest --verbose --output-on-failure

      - name: Check memory leaks with Valgrind
        run: |
          valgrind --leak-check=full --error-exitcode=1 \
          ./build/tests/matrix_tests

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html
